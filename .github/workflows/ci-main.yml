# ==============================================================================
# ResourceHub — Workflow CI/CD de Producción (`main` y tags `v*`, DEC-099)
# ==============================================================================
# `main` es el entorno estable de PRODUCCIÓN. Solo recibe promociones desde
# `develop` (Preproducción validada) o correcciones urgentes `hotfix/*`.
# Ejecuta la verificación completa tras integrar en `main` y genera el artefacto
# reproducible de Producción con manifiesto y checksums `SHA-256` (`retention-days: 5`).
# ==============================================================================
name: CI/CD — Main (Production) Verification & Reproducible Artifact

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: ci-main-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-and-package:
    name: Production Verify & Package Reproducible Artifact (Java 21)
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: 1. Checkout repository
        uses: actions/checkout@v7

      - name: 2. Set up OpenJDK 21 LTS (Temurin) with Maven Cache
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: 3. Gate — Security & Secret Scan
        run: ./scripts/security-scan.sh

      - name: 4. Verify all Quality Gates (Production)
        run: ./scripts/dev.sh verify

      - name: 5. Package Reproducible Production Artifact & SHA-256 Checksums
        run: ./scripts/dev.sh package

      - name: 6. Upload Production Distribution (5-day retention for Free Quota)
        uses: actions/upload-artifact@v7
        with:
          name: resourcehub-prod-dist-${{ github.sha }}
          path: target/dist/
          retention-days: 5
          if-no-files-found: error
